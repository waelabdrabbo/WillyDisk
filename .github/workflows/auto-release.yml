name: Auto release

# A `VERSION` bump on main releases itself once CI has accepted the commit: this
# workflow tags `v<version>` when that tag does not exist yet, and pushing the
# tag starts release.yml. Pushes that leave VERSION alone — including the cask
# commit a release writes back to main — find their tag already there and
# release nothing, so the loop terminates.
#
# The tag is pushed with RELEASE_TOKEN and not GITHUB_TOKEN: a tag pushed with
# the default token does not start another workflow run, so release.yml would
# never see it. A tag pushed by hand starts release.yml directly, without CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: The release token is configured
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set. A tag pushed with the default token cannot start release.yml; see CONTRIBUTING.md, Releasing."
            exit 1
          fi

      - name: Check out the commit CI accepted
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Tag when VERSION is new
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          # A newer commit already on main carries the same or a later VERSION;
          # its own CI run is the one that should release it.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main has moved past ${{ github.event.workflow_run.head_sha }}; leaving the release to the newer run."
            exit 0
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          git fetch --quiet --tags origin
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; $version is already released."
            exit 0
          fi
          # A fresh runner carries no git identity, and an annotated tag needs one.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "WillyDisk $version"
          git push origin "$tag"
          echo "Tagged $tag; release.yml is packaging it."
