name: CI

# Every change must build, pass the suite, assemble a bundle whose version comes
# from VERSION, exercise the command-line scan, and render the screens. The renders
# are uploaded so a visual change can be reviewed without a Mac in front of you.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-render:
    # DiskUI calls SwiftUI APIs introduced in the macOS 26 SDK behind
    # `#available(macOS 26.0, *)`, so the SDK must be 26 or newer even though the
    # deployment target is 14. The macos-15 image ships the 15.x SDK and cannot
    # compile DiskUI.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history so the bundle's build number is the commit count, not
          # the single commit a shallow clone holds.
          fetch-depth: 0

      - name: Toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk"
          major="${sdk%%.*}"
          case "$major" in
            ''|*[!0-9]*)
              echo "::error::could not read the macOS SDK version from '$sdk'"
              exit 1
              ;;
          esac
          if [ "$major" -lt 26 ]; then
            echo "::error::the macOS $sdk SDK is too old: DiskUI needs the macOS 26 SDK. Run this job on macos-26."
            exit 1
          fi

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle
        run: bash Scripts/bundle-app.sh

      - name: Bundle reports the version in VERSION
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < VERSION)"
          actual="$(plutil -extract CFBundleShortVersionString raw \
            .build/WillyDisk.app/Contents/Info.plist)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::bundle reports version '$actual' but VERSION says '$expected'"
            exit 1
          fi
          echo "Bundle version: $actual"

      - name: Command-line scan
        run: |
          set -euo pipefail
          bin=".build/WillyDisk.app/Contents/MacOS/WillyDisk"
          "$bin" scan Sources/DiskCLI --depth 1 --top 3 > /tmp/scan.txt
          grep -q '^WillyDisk scan' /tmp/scan.txt
          "$bin" scan Sources/DiskCLI --json | python3 -c '
          import json, sys
          record = json.load(sys.stdin)
          assert record["schemaVersion"] == 1, record["schemaVersion"]
          assert record["fileCount"] > 0, record["fileCount"]
          assert record["rootPath"].endswith("Sources/DiskCLI"), record["rootPath"]
          '
          set +e
          "$bin" scan --bogus >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::a usage error exited $status, expected 2"
            exit 1
          fi

      - name: Render the screens
        run: |
          set -euo pipefail
          bash Scripts/render-screens.sh -a both -S both -o .build/renders/ci
          bash Scripts/render-screens.sh -a both -S help -c -o .build/renders/ci
          bash Scripts/render-screens.sh -a both -S settings -c -s 460x760 -o .build/renders/ci
          bash Scripts/render-screens.sh -a both -S categories -o .build/renders/ci
          bash Scripts/render-screens.sh -a both -S search -o .build/renders/ci
          bash Scripts/render-screens.sh -a both -S cleanup -c -o .build/renders/ci
          bash Scripts/render-screens.sh -a both -S duplicates -c -o .build/renders/ci
          bash Scripts/render-screens.sh -a both -S history -c -o .build/renders/ci

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: .build/renders/ci/*.png
          if-no-files-found: warn
