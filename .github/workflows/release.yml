name: Release

# Pushing a `v*` tag is the only way to publish. The tag must name the version in
# VERSION, and the release page says plainly that the artifact is unsigned and
# not notarized. There is no Developer ID certificate and no notarization step.
# The same run renders the Homebrew cask from VERSION and these checksums and
# commits it to `Casks/`, because this repository is its own tap, so `brew` and
# the Releases page always agree.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Same SDK requirement as CI: DiskUI is built against the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history so the bundle's build number is the commit count.
          fetch-depth: 0

      - name: Toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk"
          major="${sdk%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "::error::the macOS $sdk SDK is too old: DiskUI needs the macOS 26 SDK. Run this job on macos-26."
            exit 1
          fi

      - name: Tag matches VERSION
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match VERSION '$version'; tag v$version instead."
            exit 1
          fi
          echo "Releasing $version"

      - name: Package the zips and checksums
        env:
          WILLYDISK_ARCHS: arm64 x86_64
        run: bash Scripts/package-release.sh

      - name: Verify the published checksums
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          cd .build/release
          for checksum in "WillyDisk-$version"-*.zip.sha256; do
            shasum -a 256 -c "$checksum"
          done

      - name: Fill in the release notes
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          arm64_digest="$(awk '{print $1}' ".build/release/WillyDisk-$version-arm64.zip.sha256")"
          x86_64_digest="$(awk '{print $1}' ".build/release/WillyDisk-$version-x86_64.zip.sha256")"

          # The release tag is checked out; the notes list the commits since the
          # previous release tag. The VERSION bump and the cask write-back are
          # housekeeping and would not tell anyone what changed.
          git fetch --tags --force origin
          repo_url="https://github.com/$GITHUB_REPOSITORY"
          if previous="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)"; then
            range="${previous}..HEAD"
          else
            range="HEAD"
          fi
          git log --no-merges --reverse \
            --pretty=format:"- %s ([%h](${repo_url}/commit/%H))" \
            "$range" \
            | grep -vE '^- (chore\(release\):|willydisk [0-9])' \
            > "$RUNNER_TEMP/changes.md" || true
          if [ ! -s "$RUNNER_TEMP/changes.md" ]; then
            echo "- No user-facing commits since the previous release." > "$RUNNER_TEMP/changes.md"
          fi

          sed \
            -e "s|{{VERSION}}|$version|g" \
            -e "s|{{TAG}}|$GITHUB_REF_NAME|g" \
            -e "s|{{SHA256_ARM64}}|$arm64_digest|g" \
            -e "s|{{SHA256_X86_64}}|$x86_64_digest|g" \
            -e "s|{{REPO_URL}}|https://github.com/$GITHUB_REPOSITORY.git|g" \
            -e "s|{{REPO_LINK}}|https://github.com/$GITHUB_REPOSITORY|g" \
            .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          python3 - "$RUNNER_TEMP/changes.md" "$RUNNER_TEMP/notes.md" <<'PY'
          import re
          import sys

          changes = open(sys.argv[1], encoding="utf-8").read().strip()
          notes = open(sys.argv[2], encoding="utf-8").read()
          pending = sorted(
              set(re.findall(r"\{\{[A-Z_]+\}\}", notes)) - {"{{CHANGES}}"}
          )
          if pending:
              print("::error::the release notes still carry an unfilled placeholder: " + ", ".join(pending))
              sys.exit(1)
          notes = notes.replace("{{CHANGES}}", changes)
          open(sys.argv[2], "w", encoding="utf-8").write(notes)
          PY

      # The tap is this repository, so the cask is a file here. It is written
      # before the release is published: a run that cannot commit it stops while
      # the release is still absent, and re-running the job fixes both. The file
      # is rendered from the checksums above, never hand-edited.
      - name: Commit the cask the tap serves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          work="$RUNNER_TEMP/tap"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64)"

          rm -rf "$work"
          git -c http.extraheader="$auth" clone --depth 1 \
            "https://github.com/${{ github.repository }}.git" "$work"
          bash Scripts/homebrew-cask.sh render --assets .build/release --out "$work/Casks/willydisk.rb"

          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.extraheader "$auth"
          git add Casks/willydisk.rb
          if git diff --cached --quiet; then
            echo "The tap already serves WillyDisk $version."
            exit 0
          fi
          git commit -m "willydisk $version"
          git push origin HEAD
          echo "Casks/willydisk.rb now serves WillyDisk $version."

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="$(tr -d '[:space:]' < VERSION)"
          assets=(".build/release/WillyDisk-$version-arm64.zip"
                  ".build/release/WillyDisk-$version-arm64.zip.sha256"
                  ".build/release/WillyDisk-$version-x86_64.zip"
                  ".build/release/WillyDisk-$version-x86_64.zip.sha256")
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::release $tag is already published; edit VERSION and push a new tag instead of rewriting it."
              exit 1
            fi
            # A previous run stopped before publishing: replace the draft's
            # assets and publish it rather than failing on the leftover.
            echo "Resuming draft release $tag."
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md" --draft=false
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --draft \
              --title "WillyDisk ${tag#v}" \
              --notes-file "$RUNNER_TEMP/notes.md"
            gh release edit "$tag" --draft=false
          fi
          echo "Published $(gh release view "$tag" --json url --jq .url)"
